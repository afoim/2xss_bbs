name: Deploy

# 与 2xss_hub / 2xss_box 同一套模型：
#   edit  = 源码（GitHub 默认分支，日常都推这里）
#   main  = 纯产物（dist/ + wrangler.jsonc），每次由本 workflow 强制覆盖
# **main 上任何独有提交都会被永久抹掉**，别把它当备份。
#
# 构建放在 Actions 里而不是 CDN 侧：CDN 构建器多半只给 minified 堆栈，
# 同一提交在本地却能构建成功，定位成本极高。
#
# 构建和推送必须在**同一个 workflow** 里 —— GitHub 官方行为：用仓库自带的
# GITHUB_TOKEN 推送不会触发任何下游 workflow，而且不报错。拆成两个的话
# main 前进了、站点没更新，查都没处查。

on:
  push:
    branches:
      - edit
  workflow_dispatch:
    inputs:
      # 必须声明：Pages CMS 之类的「侧边栏按钮」调 actions API 时无条件带上
      # inputs.payload，而 GitHub 会拒绝 workflow 未声明的输入并返回
      # 422 Unexpected inputs provided
      payload:
        description: 调用方传入的上下文（未使用）
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # node 22：vite 8 要求 20+
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build 串了 build-icon-subset → tsc --noEmit → vite build → build-feeds，
      # 类型错误会在中间拦下来，不会带着错误产物上线。
      # build-feeds 要访问 https://i.2x.nz 生成 rss/sitemap，它失败只打警告不中断。
      - run: pnpm build

      - name: 检查产物
        run: |
          test -f dist/index.html || { echo "产物异常：没有 index.html"; exit 1; }
          test -f dist/_redirects || echo "提示：没有 _redirects（CF Workers 用 wrangler.jsonc 的 SPA 回退，可忽略）"
          echo "文件数: $(find dist -type f | wc -l)"

      - name: 推送产物到 main（dist/ 子目录 + wrangler.jsonc）
        env:
          TOKEN: ${{ github.token }}
        run: |
          WORKDIR="$(mktemp -d)"
          cp -r dist "$WORKDIR/dist"
          cp wrangler.jsonc "$WORKDIR/"

          cd "$WORKDIR"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q \
            -m "build: ${GITHUB_SHA:0:7} 的构建产物" \
            -m "workflow: ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main
          rm -rf "$WORKDIR"
